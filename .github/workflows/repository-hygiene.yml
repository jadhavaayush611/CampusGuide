name: Repository Hygiene & Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  hygiene-check:
    name: Hygiene & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Executable Permissions & Scripts
        run: |
          chmod +x scripts/*.sh

      - name: Audit for Absolute Paths
        run: |
          if grep -rnE "[C|D]:\\\\|/Users/" --exclude-dir={.git,node_modules,target} .; then
            echo "Error: Absolute paths detected in committed files!"
            exit 1
          fi

      - name: Execute Verification Script
        run: |
          ./scripts/build.sh
