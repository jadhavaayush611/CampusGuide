name: Repository Hygiene & Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  hygiene-check:
    name: Hygiene & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Verify Executable Permissions & Scripts
        run: |
          chmod +x scripts/*.sh

      - name: Audit Repository Hygiene
        run: |
          ./scripts/check-hygiene.sh

      - name: Execute Verification Script
        run: |
          ./scripts/build.sh
