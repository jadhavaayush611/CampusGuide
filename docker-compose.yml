version: '3.8'

services:
  database:
    image: mongo:6.0
    container_name: campusguide-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - campusguide-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusguide-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_MONGODB_URI=mongodb://database:27017/campusguide
      - JWT_SECRET=development_jwt_secret_key_which_is_at_least_32_characters_long
      - AI_GATEWAY_BASE_URL=http://ai-gateway:8000
      - AI_GATEWAY_ENABLED=false
    depends_on:
      - database
    networks:
      - campusguide-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080/api/v1
    container_name: campusguide-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - campusguide-net
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  campusguide-net:
    driver: bridge
