# CampusGuide Test Profile Configuration
spring.application.name=campusguide-test

# Logging Level
logging.level.root=WARN
logging.level.com.campusguide=INFO

# Test Database Connection (Using embedded MongoDB)
spring.data.mongodb.uri=mongodb://localhost:27017/test_campusguide
spring.data.mongodb.uuid-representation=standard

# JWT Settings for Testing
jwt.secret=test_jwt_secret_key_which_must_be_at_least_32_characters_long_for_security_checks
jwt.expiration=3600000

# Mock Storage Location for testing
storage.location=target/uploads-test

# AI Gateway and Atlas Subsystem settings
ai.gateway.enabled=false
atlas.enabled=true
atlas.providers.openai.api-key=test_api_key
atlas.providers.openai.base-url=http://localhost:8000
atlas.providers.openai.model=gpt-4o-mini

# Disable auth rate limiter for tests to prevent random test failures
auth.ratelimit.enabled=false
