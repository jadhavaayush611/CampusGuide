# CampusGuide Staging Profile Configuration
server.port=8080

# Logging Level
logging.level.root=INFO
logging.level.com.campusguide=DEBUG

# Staging Database Connection
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://staging-mongo:27017/campusguide_staging}
spring.data.mongodb.uuid-representation=standard

# JWT Settings
jwt.secret=${JWT_SECRET:staging_jwt_secret_key_which_should_be_long_and_secure_minimum_32_chars}
jwt.expiration=86400000

# File Storage Configuration
storage.location=${STORAGE_LOCATION:uploads/resources}

# SMTP Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.staging.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# AI Gateway / Atlas Configuration
ai.gateway.base-url=${AI_GATEWAY_BASE_URL:http://staging-ai-gateway:8000}
ai.gateway.timeout=15s
ai.gateway.enabled=true

atlas.enabled=true
atlas.providers.openai.api-key=${OPENAI_API_KEY:}
atlas.providers.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
