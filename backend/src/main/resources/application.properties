spring.application.name=campusguide

spring.profiles.active=dev

# File Storage Configuration
storage.location=uploads/resources

# Multipart Upload Configuration (20MB Limit)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# AI Gateway Configuration
ai.gateway.base-url=http://localhost:8000
ai.gateway.timeout=10s
ai.gateway.enabled=true
ai.gateway.history-limit=20

# Recommendation Weight Configuration
recommendation.academic.prerequisite-weight=0.9
recommendation.academic.department-weight=0.7
recommendation.event.deadline-weight=0.8

# MongoDB UUID Representation Configuration
spring.data.mongodb.uuid-representation=standard

# Actuator Endpoint Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# Auth Rate Limiting Configuration
auth.ratelimit.enabled=true
auth.ratelimit.capacity=15
auth.ratelimit.requests-per-minute=10
