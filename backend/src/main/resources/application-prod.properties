# CampusGuide Production Profile Configuration
server.port=${PORT:8080}

# Logging Level
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.campusguide=INFO

# Production Database Connection (Enforce environment variable injection)
spring.data.mongodb.uri=${DATABASE_URL}
spring.data.mongodb.uuid-representation=standard

# JWT Security Configuration (Enforce environment variable injection)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Storage Configuration
storage.location=${STORAGE_LOCATION:uploads/resources}

# SMTP Mail Configuration (Enforce environment variable injection)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# AI Gateway / Atlas Configuration
ai.gateway.base-url=${AI_GATEWAY_BASE_URL}
ai.gateway.timeout=10s
ai.gateway.enabled=true

atlas.enabled=true
atlas.providers.openai.api-key=${OPENAI_API_KEY:${OPENROUTER_API_KEY}}
atlas.providers.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}